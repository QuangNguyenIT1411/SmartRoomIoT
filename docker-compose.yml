name: smartroom-iot

services:
  postgres:
    image: postgres:17
    container_name: smartroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartroom_iot
      POSTGRES_USER: smartroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartroom -d smartroom_iot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: smartroom-iot-postgres-data
