server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  application:
    name: smartroom-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartroom_iot}
    username: ${DB_USERNAME:smartroom}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  task:
    scheduling:
      pool:
        size: 2

smartroom:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  device:
    scan-interval-ms: 15000
    offline-after-seconds: 30
  mqtt:
    # MQTT_URI remains a fallback for existing local setups.
    broker-url: ${MQTT_BROKER_URL:${MQTT_URI:tcp://192.168.130.174:1883}}
    client-id: ${MQTT_CLIENT_ID:smartroom-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    tls-enabled: ${MQTT_TLS_ENABLED:false}
    ca-path: ${MQTT_CA_PATH:}
    reconnect-delay-ms: 5000
    publish-timeout-ms: 5000
